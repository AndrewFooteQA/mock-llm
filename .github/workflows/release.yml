name: Release

# On every push to main, changesets/action either
#  - opens/updates the "Version Packages" PR (when unreleased changesets exist), or
#  - publishes to npm (when that PR has just been merged and package.json has a new version).
# Publishing happens only here — never from a laptop.
on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: write # version commits + tags
  pull-requests: write # the Version Packages PR
  id-token: write # npm trusted publishing (OIDC) + provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: npm ≥ 11.5.1 (trusted publishing)
        run: npm install -g npm@latest && npm --version
      - run: npm ci
      - name: Install Playwright browser for the playwright example
        run: |
          npm run build
          cd examples/playwright-chat-ui
          npm install --no-audit --no-fund --loglevel=error
          npx playwright install --with-deps chromium
      - run: npm run check

      - id: changesets
        uses: changesets/action@v1
        with:
          publish: npm run release
          title: Version Packages
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only for the very first publish (npm can't attach a trusted publisher to a package that
          # doesn't exist yet). Delete the NPM_TOKEN secret once trusted publishing is configured;
          # from then on npm authenticates this workflow via OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify the published package against every example
        if: steps.changesets.outputs.published == 'true'
        run: npm run verify:published
