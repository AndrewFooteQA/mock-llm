name: Release

# On every push to main, changesets/action either
#  - opens/updates the "Version Packages" PR (when unreleased changesets exist), or
#  - publishes to npm (when that PR has just been merged and package.json has a new version).
# Publishing happens only here — never from a laptop.
on:
  push:
    branches: [main]

concurrency: release

permissions:
  actions: write # dispatch the Pages workflow after a release
  contents: write # version commits + tags
  pull-requests: write # the Version Packages PR
  id-token: write # npm trusted publishing (OIDC) + provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: npm ≥ 11.5.1 (trusted publishing)
        run: npm install -g npm@latest && npm --version
      - run: npm ci
      - name: Install the Claude Code CLI for the claude-code-cli example (a skip fails CI)
        # npm 12 blocks install scripts unless allowed; the CLI's postinstall fetches its native binary.
        run: npm install -g --allow-scripts=@anthropic-ai/claude-code @anthropic-ai/claude-code && claude --version
      - name: Install Playwright browser for the playwright example
        run: |
          npm run build
          cd examples/playwright-chat-ui
          npm install --no-audit --no-fund --loglevel=error
          npx playwright install --with-deps chromium
      - run: npm run check

      # v2 reads the CHANGESETS_OUTPUT file that `changeset publish` (CLI v3) writes, to detect what was
      # published, push the vX.Y.Z tag and create the GitHub release. (v1 parsed log lines that CLI v3
      # no longer prints, so it missed the 0.1.0 publish.)
      # Is the current version already on npm? Compared with the same check after the changesets step, this tells us
      # whether this run published, even if that step failed afterwards (e.g. a GitHub API timeout creating the
      # GitHub Release, as happened with 0.2.2).
      - id: before
        name: Version on npm before publishing?
        run: node scripts/release-state.mjs before

      - id: changesets
        uses: changesets/action@v2
        with:
          publish-script: npm run release
          pr-title: Version Packages
          commit-message: 'chore: version packages'
        # No npm token: npm trusts this workflow (trusted publishing, OIDC via `id-token: write`).

      # npm logs why trusted publishing failed (e.g. a trusted-publisher mismatch → E404) only at verbose level,
      # which goes to its debug log rather than the console.
      - name: On failure, show npm's OIDC / auth log lines
        if: failure()
        run: grep -hiE "oidc|trusted|provenance|E40[134]" ~/.npm/_logs/*.log | tail -40 || true

      - id: after
        name: Did this run publish? (npm before vs. after, waiting for propagation)
        if: always() && steps.before.outcome == 'success'
        run: node scripts/release-state.mjs after "${{ steps.before.outputs.existed }}"

      # These run whenever this run published, even if the changesets step failed after publishing.
      - name: Verify the published package against every example
        if: always() && steps.after.outputs.published == 'true'
        run: npm run verify:published

      # A separate workflow run, so a failed docs deploy never marks the npm release as failed. It builds the commit
      # that was published (identical to the tag, which may not exist if the tag push is what failed).
      - name: Deploy the docs site for this release (Pages workflow)
        if: always() && steps.after.outputs.published == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main -f ref="${{ github.sha }}"
