name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Library typecheck + tests on every supported Node line.
  test:
    name: test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # The full definition of done: tests, playground lessons, every example, and the package contents.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # changeset status compares against origin/main
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Playwright browser for the playwright example
        run: |
          npm run build
          cd examples/playwright-chat-ui
          npm install --no-audit --no-fund --loglevel=error
          npx playwright install --with-deps chromium
      - run: npm run check
      - name: Package contents + smoke test of the packed tarball
        run: npm run pack:check
      # Only when something that ships changed (src/ or package.json release fields): tests, docs and Renovate's
      # devDependency / lockfile updates don't need one.
      - name: Changeset present (PRs that change what ships)
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        run: if node scripts/needs-changeset.mjs origin/main; then npx changeset status --since=origin/main; fi
